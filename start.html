<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Matveckan</title>
<style>
:root{
  --bg:#FAF8FE; --card:#fff; --ink:#2C2842; --muted:#8C86A6; --line:#ECE7F7; --fill:#F4F0FC;
  --lilac:#CBC0F2; --lilac-deep:#6E60BE;
  --mint:#BFE4D6; --mint-deep:#3E8C71;
  --blush:#F7CBD8; --blush-deep:#B4607A;
  --butter:#F9E6B4; --butter-deep:#8E6E1C;
  --sky:#C5DCF5; --sky-deep:#3F72A8;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
 font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 padding-bottom:calc(78px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}

header{position:sticky;top:0;z-index:20;background:rgba(250,248,254,.9);backdrop-filter:blur(14px);
 border-bottom:1px solid var(--line);color:var(--ink);
 padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
header h1{font-size:21px;flex:1}
header .sub{font-size:12.5px;color:var(--muted);display:block;font-weight:400;letter-spacing:0;margin-top:2px}
header .gear{width:34px;height:34px;display:grid;place-items:center;color:var(--lilac-deep);
 background:var(--fill);border-radius:10px}
header .gear svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}

main{padding:16px 16px 28px;max-width:640px;margin:0 auto}
.view{display:none}.view.on{display:block}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.93);
 backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);
 padding-bottom:env(safe-area-inset-bottom)}
nav button{padding:9px 2px 10px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
 padding:3px 12px;border-radius:999px;box-sizing:content-box;width:20px;height:20px}
nav button.on{color:var(--lilac-deep);font-weight:600}
nav button.on svg{background:var(--lilac)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sec-title{font-size:12.5px;color:var(--muted);margin:26px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-title:first-child{margin-top:2px}
.sec-title button{font-size:12.5px;color:var(--lilac-deep);font-weight:600}

.btn{background:var(--lilac);color:var(--ink);border-radius:11px;padding:12px 16px;font-weight:600;font-size:15px;
 display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.quiet{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.danger{background:transparent;color:var(--blush-deep);border:1px solid var(--blush);font-weight:500}
.btn.wide{width:100%}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.tiny{font-size:12.5px;color:var(--muted)}

.pill{display:inline-block;font-size:11px;padding:3px 8px;border-radius:7px;background:var(--fill);color:var(--lilac-deep);font-weight:600;white-space:nowrap}
.pill.box{background:var(--butter);color:var(--butter-deep)}
.pill.late{background:var(--butter);color:var(--butter-deep);margin-left:5px}
.pill.r{background:var(--mint);color:var(--mint-deep);margin-left:5px}
.pill.q{background:var(--blush);color:var(--blush-deep);margin-left:5px}
.pill.act,.pill.wk{background:var(--lilac);color:var(--ink)}

input[type=text],input[type=number],textarea,select{width:100%;background:#fff;border:1px solid var(--line);
 border-radius:11px;padding:11px 12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--lilac-deep)}
.empty{text-align:center;color:var(--muted);padding:32px 20px;font-size:14.5px}

.subtabs{display:flex;gap:3px;margin-bottom:20px;background:var(--fill);padding:3px;border-radius:12px}
.subtabs button{flex:1;padding:9px 4px;border-radius:9px;font-size:14px;color:var(--muted)}
.subtabs button.on{background:#fff;color:var(--lilac-deep);font-weight:600}

.day{margin-bottom:14px}
.day-head{display:flex;align-items:baseline;gap:9px;padding:0 2px 7px}
.day-head b{font-size:15px;font-weight:640;letter-spacing:-.01em}
.dish{display:flex;gap:11px;padding:13px;border-top:1px solid var(--line);align-items:flex-start}
.dish:first-child{border-top:0}
.dish .nm{font-weight:560;line-height:1.3}
.dish .meta{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.dish .x,.slist .x{color:#C9C3DC;font-size:21px;line-height:1;padding:0 2px}
.addrow{padding:11px 13px;border-top:1px solid var(--line);background:var(--fill)}
.addrow button{color:var(--lilac-deep);font-weight:600;font-size:14px}

.rlist button.item{display:flex;width:100%;text-align:left;gap:10px;padding:13px;border-top:1px solid var(--line);align-items:center}
.rlist button.item:first-child{border-top:0}
.rlist .item .nm{font-weight:560}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.chip{padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:14px;white-space:nowrap;color:var(--muted)}
.chip.on{background:var(--lilac);color:var(--ink);border-color:var(--lilac);font-weight:600}

.slist{margin:0;padding:0}
.slist li{list-style:none;display:flex;gap:11px;padding:12px 13px;border-top:1px solid var(--line);align-items:center}
.slist li:first-child{border-top:0}
.box{width:21px;height:21px;flex:0 0 21px;border:1.5px solid #CFC8E4;border-radius:50%;display:grid;place-items:center}
.box.on{background:var(--mint);border-color:var(--mint)}
.box svg{width:12px;height:12px;stroke:var(--mint-deep);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;display:none}
.box.on svg{display:block}
.done .txt{color:#B6B0C9}
.done .txt b{font-weight:400;text-decoration:line-through}
.qty{color:var(--muted);font-variant-numeric:tabular-nums}
.src{font-size:12px;color:var(--muted);margin-top:3px}

.pos{width:46px;flex:0 0 46px;padding:6px 4px!important;text-align:center;font-size:13px;
 font-variant-numeric:tabular-nums;border-radius:8px!important}
.ord{display:flex;flex-direction:column;gap:2px}
.ord button{width:28px;height:19px;border:1px solid var(--line);border-radius:6px;font-size:10px;color:var(--lilac-deep);background:#fff}
.mv{font-size:12px;color:var(--lilac-deep);font-weight:600;white-space:nowrap;border:1px solid var(--line);
 border-radius:9px;padding:6px 9px;background:#fff}
.mv.hint{background:var(--lilac);color:var(--ink);border-color:var(--lilac)}
.qbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden;flex:0 0 auto}
.qbox button{width:28px;height:30px;font-size:15px;color:var(--lilac-deep);font-weight:600}
.qbox span{min-width:52px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}

.daysel{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px}
.daysel button{flex:0 0 auto;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:#fff;font-size:14px;color:var(--muted)}
.daysel button.on{background:var(--sky);color:var(--ink);border-color:var(--sky);font-weight:600}

.ing{margin:0;padding:0}
.ing li{list-style:none;padding:11px 13px;border-top:1px solid var(--line);display:flex;gap:12px}
.ing li:first-child{border-top:0}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden}
.stepper button{width:38px;height:38px;font-size:18px;color:var(--lilac-deep);font-weight:600}
.stepper span{min-width:34px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}

.wknav{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.wknav .lbl{flex:1;text-align:center;font-weight:640;letter-spacing:-.02em}
.wknav button.arw{width:40px;height:40px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:17px;color:var(--lilac-deep)}
.wkcard{margin-bottom:24px}
.wkcard h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}

.irow{display:grid;grid-template-columns:60px 80px 1fr 24px;gap:6px;margin-bottom:7px;align-items:center}
.irow input,.irow select{padding:9px 8px;border-radius:9px}
.irow .x{font-size:19px;color:#C9C3DC;text-align:center}

.scrim{position:fixed;inset:0;background:rgba(44,40,66,.32);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:18px 18px 0 0;
 max-height:90vh;overflow:auto;display:none;padding:8px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet.on{display:block}
.grab{width:36px;height:4px;background:var(--lilac);border-radius:2px;margin:8px auto 16px}
.sheet h2{font-size:19px;margin-bottom:12px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}

.fab{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:35;display:none;
 background:var(--ink);color:#fff;border-radius:999px;padding:12px 18px;font-size:14px;font-weight:600;
 box-shadow:0 4px 14px rgba(44,40,66,.22)}
.fab.on{display:block}
.fab.active{background:var(--lilac);color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:94px;background:var(--ink);color:#fff;
 padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function load(){
  var raw=store.get(KEY);

    if(!S.recipes||!S.recipes.length)S.recipes=SEED_RECIPES.slice();
    if(!S.grund)S.grund=SEED_GRUND.map(function(n){return{id:uid(),name:n}});
    if(!S.framList)S.framList=SEED_FRAM.map(function(n){return{id:uid(),name:n}});

    if(!S.shopOf)S.shopOf=seedShops();

    if(!S.ordWillys)S.ordWillys=SEED_GRUND.map(normName);

    if(!S.startDay)S.startDay='wed';if(!S.endDay)S.endDay='tue';if(!S.temp)S.temp={};
    if(!S.freshOf)S.freshOf={};if(!S.qty)S.qty={};if(!S.alias)S.alias={};

function rec(id){for(var i=0;i<S.recipes.length;i++)if(S.recipes[i].id===id)return S.recipes[i];return null}

function tkey(n,d){return n+'|'+d}
function dayDishes(wn,day){
  var t=S.temp[tkey(wn,day)];

function autoFresh(n){
  var t=n.toLowerCase();
  if(t.indexOf('fryst')>-1||t.indexOf('frysta')>-1||t.indexOf('konserv')>-1||t.indexOf('burk')>-1)return false;
  for(var i=0;i<FRESH.length;i++)if(t.indexOf(FRESH[i])>-1)return true;
  return false;
}
function isFresh(n){
  var v=S.freshOf[normName(n)];
  return v===undefined?autoFresh(n):v;
}
function toggleFresh(n){
  var k=normName(n);

  if(S.freshOf[k]===autoFresh(n))delete S.freshOf[k];

  toast(n+(isFresh(n)?' är färskvara':' är inte färskvara'));

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function q1(s){return String(s).replace(/'/g,"\\'")}

function bySv(a,b){return a.n.localeCompare(b.n,'sv')}
function fmtQ(n){
  if(n==null)return '';
  n=Math.round(n*100)/100;
  if(Math.abs(n-0.5)<.001)return '½';
  if(Math.abs(n-0.25)<.001)return '¼';
  if(n%1===0)return String(n);
  return String(n).replace('.',',');
}
function scaled(ing,p,bas){return ing.q==null?null:ing.q*(p/(bas||4))}

function stepWeek(d){

    a.splice(i,1);
  }else{
    if(a.length>=2)a.shift();
    a.push(n);a.sort(function(x,y){return x-y});
  }
  S.checked={};S.approved={};S.later={};save();render();

  var n=1;S.weeks.forEach(function(w){if(w.n>=n)n=w.n+1});

function dayOrderAll(){

/* var i rotationen en rätt redan ligger, t.ex. ["Ons v1","Fre v3"] */
function placements(rid){
  var out=[],seen={};
  S.weeks.slice().sort(function(a,b){return a.n-b.n}).forEach(function(w){
    dayOrderAll().forEach(function(k){
      var list=S.temp[tkey(w.n,k)]||w.days[k]||[];
      list.forEach(function(x){
        if(x.recipeId!==rid)return;
        var lab=labelOf(k).slice(0,3)+' v'+w.n;
        if(!seen[lab]){seen[lab]=1;out.push(lab)}
      });
    });
  });
  return out;
}
function placeLabel(rid,max){
  var p=placements(rid);
  if(!p.length)return '';
  if(max&&p.length>max)return p.slice(0,max).join(', ')+' +'+(p.length-max);
  return p.join(', ');
}

function shopFor(n){return S.shopOf[normName(n)]||null}
function setShop(n,s){S.shopOf[normName(n)]=s}
function ordArr(shop){return shop==='fram'?S.ordFram:S.ordWillys}
function ordIdx(shop,name){var i=ordArr(shop).indexOf(normName(name));return i<0?1e6:i}
function sortDisp(list,shop,storeOrder){
  if(storeOrder)list.sort(function(a,b){return (ordIdx(shop,a.n)-ordIdx(shop,b.n))||bySv(a,b)});
  else list.sort(bySv);
  return list;
}
function materialize(shop,list){
  ordArr(shop).length=0;
  list.forEach(function(it){ordArr(shop).push(normName(it.n))});
  save();
}
function setPos(shop,name,v){
  var a=ordArr(shop),k=normName(name),i=a.indexOf(k),
      to=Math.max(1,Math.min(a.length||1,parseInt(v,10)||1))-1;
  if(i>-1)a.splice(i,1);
  a.splice(to,0,k);
  save();render();toast(name+' → plats '+(to+1));
}
function moveOrd(shop,name,dir){
  var a=ordArr(shop),i=a.indexOf(normName(name)),j=i+dir;
  if(i<0||j<0||j>=a.length)return;
  var t=a[i];a[i]=a[j];a[j]=t;save();renderShop();
}
function groups(){
  var map={},pending=[],fram=[],willys=[],other=[],skipped=[],k;
  actWeeks().forEach(function(w,pos){
    DAYS.forEach(function(d){
      dayDishes(w.n,d[0]).forEach(function(dish){
        var r=rec(dish.recipeId);if(!r)return;
        var off=dayOffset(d[0],pos);
        r.ing.forEach(function(ing){
          var key=(ing.n+'|'+ing.u).toLowerCase();
          if(!map[key])map[key]={key:key,n:ing.n,u:ing.u,q:null,src:[],off:off};
          var v=scaled(ing,dish.portions,r.bas);
          if(v!=null)map[key].q=(map[key].q||0)+v;
          if(off<map[key].off)map[key].off=off;
          if(map[key].src.indexOf(r.name)<0)map[key].src.push(r.name);
        });
      });
    });
  });
  for(k in map){
    var m=map[k],it={key:k,n:m.n,u:m.u,q:m.q,src:m.src.join(', '),auto:true,
                     off:m.off,fresh:isFresh(m.n)},a=S.approved[k];
    if(a==='fram')fram.push(it);
    else if(a==='other')other.push(it);
    else if(a==='willys')willys.push(it);
    else if(a===false)skipped.push(it);
    else{it.hint=shopFor(m.n);pending.push(it)}
  }
  S.extra.forEach(function(e){
    var it={key:'f:'+e.id,n:e.name,u:'',q:null,src:'',manual:e.id};
    if(e.shop==='willys')willys.push(it);else if(e.shop==='other')other.push(it);else fram.push(it);
  });
  pending.sort(bySv);skipped.sort(bySv);
  return{pending:pending,fram:fram,willys:willys,other:other,skipped:skipped};
}
function splitCount(n){
  var m=String(n).match(/^(.*\S)\s+(\d+)$/);
  return m?{name:m[1],def:parseFloat(m[2])}:{name:String(n),def:null};
}
function normName(n){
  var t=splitCount(n).name.toLowerCase().replace(/\s*-\s*(fram|willys)$/,'');
  if(typeof S==='undefined'||!S||!S.alias)return t;
  for(var i=0;i<6;i++){
    var a=S.alias[t];
    if(!a||a===t)break;
    t=a;
  }
  return t;
}
function stepFor(u){
  if(u==='g')return 50;if(u==='ml')return 50;if(u==='kg')return 0.5;
  if(u==='dl')return 0.5;if(u==='l')return 0.5;return 1;
}
function baseQty(it){
  if(it.q!=null)return it.q;
  if(it.def!=null)return it.def;
  return null;
}
function qtyOf(it){
  var v=S.qty[it.key];
  return v===undefined?baseQty(it):v;
}
function bumpQty(key,d){
  var it=window._rows&&window._rows[key];if(!it)return;
  var cur=qtyOf(it),base=cur==null?0:cur;
  var v=Math.round((base+d)*100)/100;
  if(v<0)v=0;
  S.qty[key]=v;
  if(v===baseQty(it))delete S.qty[key];
  save();render();
}
function mergeByName(list){
  var seen={},out=[];
  list.forEach(function(it){
    var k=normName(it.n),prev=seen[k];
    if(!prev){seen[k]=it;out.push(it);return}
    /* samma vara två gånger: behåll raden, slå ihop mängd och receptmärkning */
    if(it.q!=null){prev.q=(prev.q||0)+it.q;prev.u=prev.u||it.u}
    if(it.def!=null&&prev.def==null)prev.def=it.def;
    if(it.off!=null&&(prev.off==null||it.off<prev.off))prev.off=it.off;
    if(it.fresh)prev.fresh=true;
    if(it.auto)prev.auto=true;
    if(it.src)prev.src=prev.src?prev.src+', '+it.src:it.src;
    if(it.manual&&!prev.manual)prev.manual=it.manual;
  });
  return out;
}

           .concat(g.willys));

function carryKeys(from,to){
  if(from===to)return;
  ['shopOf','freshOf','storeName'].forEach(function(m){
    if(S[m][from]!==undefined&&S[m][to]===undefined)S[m][to]=S[m][from];
    delete S[m][from];
  });
}
function renameItem(key,shop){
  var it=(window._rows||{})[key],v=document.getElementById('rnName').value.trim();
  if(!it||!v)return;
  var before=normName(it.n);
  if(it.standing){
    standingList(shop).forEach(function(x){if(x.id===it.sid)x.name=v});
  }else if(it.manual){
    S.extra.forEach(function(e){if(e.id===it.manual)e.name=v});
  }
  var after=normName(v);
  if(before!==after){
    carryKeys(before,after);
    ['ordFram','ordWillys'].forEach(function(o){
      var i=S[o].indexOf(before);if(i>-1)S[o][i]=after;
    });
  }
  save();sheetClose();render();toast('Omdöpt till '+v);
}
function mergeItem(key,shop){
  var it=(window._rows||{})[key],target=document.getElementById('mgTo').value;
  if(!it||!target)return;
  var from=normName(it.n),to=normName(target);
  if(from===to){sheetClose();return}
  S.alias[from]=to;
  if(it.standing)standingList(shop).forEach(function(x,i,a){if(x.id===it.sid)a.splice(i,1)});
  else if(it.manual)S.extra=S.extra.filter(function(e){return e.id!==it.manual});
  ['ordFram','ordWillys'].forEach(function(o){
    S[o]=S[o].filter(function(x){return x!==from});
  });
  carryKeys(from,to);
  delete S.checked[key];delete S.qty[key];
  save();sheetClose();render();toast(it.n+' slogs ihop med '+target);
}

function moveTo(key,name,shop,label){
  var pre=key.slice(0,2);
  if(pre==='g:'||pre==='a:'||pre==='o:'){
    var sid=key.slice(2),nm='';
    var pull=function(arr){return arr.filter(function(x){if(x.id===sid){nm=x.name;return false}return true})};
    S.grund=pull(S.grund);S.framList=pull(S.framList);S.otherList=pull(S.otherList);
    nm=nm||name;
    if(shop==='fram')S.framList.push({id:uid(),name:nm});
    else if(shop==='willys')S.grund.push({id:uid(),name:nm});
    else S.otherList.push({id:uid(),name:nm,store:label||storeOf(nm)});
  }else if(pre==='f:'){
    var id=key.slice(2);
    S.extra.forEach(function(e){if(e.id===id)e.shop=shop});
  }else S.approved[key]=shop;
  setShop(name,shop);
  if(shop==='other')S.storeName[normName(name)]=label||storeOf(name);
  save();sheetClose();render();
  toast(name+' \u2192 '+(shop==='fram'?'Fram':shop==='willys'?'Willys':(label||storeOf(name))));
}
function addExtra(inputId,shop){
  var e=document.getElementById(inputId),v=e.value.trim();if(!v)return;
  S.extra.push({id:uid(),name:v,shop:shop});setShop(v,shop);e.value='';save();render();
}
function quickAdd(n,shop){S.extra.push({id:uid(),name:n,shop:shop});setShop(n,shop);save();render();

function delExtra(id){S.extra=S.extra.filter(function(e){return e.id!==id});delete S.checked['f:'+id];save();render()}
function removeRow(key,shop){
  var it=(window._rows||{})[key];if(!it)return;
  if(it.standing)delStanding(it.shop||shop,it.sid);
  else if(it.manual)delExtra(it.manual);
  else{S.approved[key]=false;delete S.checked[key];delete S.qty[key];save();render();
    toast(it.n+' borttagen ur listan');}
}
function delStanding(shop,id){
  if(shop==='fram'){S.framList=S.framList.filter(function(x){return x.id!==id});delete S.checked['a:'+id]}
  else if(shop==='other'){S.otherList=S.otherList.filter(function(x){return x.id!==id});delete S.checked['o:'+id]}
  else{S.grund=S.grund.filter(function(x){return x.id!==id});delete S.checked['g:'+id]}
  save();render();
}

function setPeriod(st,en){

function daysSinceBackup(){
  if(!S.lastBackup)return null;
  return Math.floor((Date.now()-S.lastBackup)/86400000);
}
function backupBanner(){
  var d=daysSinceBackup();
  if(d!==null&&d<3)return '';
  return '<div class="card" style="padding:12px 14px;margin-bottom:14px;border-color:var(--butter)"><div class="row">'+
    '<span class="grow tiny">'+(d===null
      ? 'Du har ingen säkerhetskopia. Allt du lagt in finns bara i den här telefonen.'
      : 'Senaste säkerhetskopian är '+d+' dagar gammal.')+'</span>'+
    '<button class="mv" onclick="go(\'more\')">Kopiera</button></div></div>';
}
function inFrame(){try{return window.self!==window.top}catch(e){return true}}
function copyBackup(){
  var t=document.getElementById('bkText');
  t.removeAttribute('readonly');
  t.focus();t.setSelectionRange(0,t.value.length);
  var ok=false;
  try{ok=document.execCommand('copy')}catch(e){}
  t.setAttribute('readonly','readonly');
  if(!ok&&navigator.clipboard){
    navigator.clipboard.writeText(t.value).then(function(){S.lastBackup=Date.now();save();toast('Kopierad')},
      function(){toast('Markera texten och kopiera för hand')});
    return;
  }
  if(ok){S.lastBackup=Date.now();save()}
  toast(ok?'Kopierad – klistra in i Anteckningar':'Markera texten och kopiera för hand');
}
function restoreBackup(){
  var v=document.getElementById('rsText').value.trim();
  if(!v)return;
  try{
    var d=JSON.parse(v);
    if(!d.weeks&&!d.plan)throw 0;
    load2(d);S=d;save();rebuildDays();go('plan','week');toast('Återställd');
  }catch(e){alert('Texten gick inte att läsa. Kontrollera att hela säkerhetskopian kom med.')}
}
function expData(){
  var b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='matveckan-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  S.lastBackup=Date.now();save();
}
function impData(inp){
  var f=inp.files[0];if(!f)return;var fr=new FileReader();
  fr.onload=function(){try{var d=JSON.parse(fr.result);if(!d.weeks&&!d.plan)throw 0;S=d;load2(d);save();go('plan','week');toast('Importerad')}
   catch(e){alert('Filen gick inte att läsa. Välj en fil som exporterats härifrån.')}};
  fr.readAsText(f);
}
function load2(d){
  if(!d.weeks&&d.std)d.weeks=d.std;
  if(!d.weeks)d.weeks=SEED_STD();
  if(!d.activeWeeks)d.activeWeeks=d.activeWeek?[d.activeWeek]:[1];
  if(!d.later)d.later={};if(!d.freshOf)d.freshOf={};if(!d.temp)d.temp={};if(!d.qty)d.qty={};if(!d.alias)d.alias={};
  if(!d.editWeek)d.editWeek=d.activeWeeks[0]||1;
  if(!d.extra)d.extra=[];if(!d.checked)d.checked={};if(!d.approved)d.approved={};
  if(!d.shopOf)d.shopOf=seedShops();
  if(!d.ordFram)d.ordFram=SEED_FRAM.map(normName);
  if(!d.ordWillys)d.ordWillys=SEED_GRUND.map(normName);
  if(!d.grund)d.grund=SEED_GRUND.map(function(n){return{id:uid(),name:n}});
  if(!d.framList)d.framList=SEED_FRAM.map(function(n){return{id:uid(),name:n}});
  if(!d.otherList)d.otherList=SEED_OTHER.map(function(o){return{id:uid(),name:o.n,store:o.b}});
  if(!d.storeName)d.storeName=seedStoreNames();
}
function wipe(){if(!confirm('Rensa allt och börja om från Påminnelse-listan?'))return;
  store.del(KEY);S=fresh();save();go('plan','week');toast('Allt rensat')}

/* ---------------- ui ---------------- */
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(window._tt);window._tt=setTimeout(function(){t.classList.remove('on')},1600)}
function sheetOpen(h){document.getElementById('sheet').innerHTML='<div class="grab"></div>'+h;
  document.getElementById('sheet').classList.add('on');document.getElementById('scrim').classList.add('on')}
function sheetClose(){document.getElementById('sheet').classList.remove('on');document.getElementById('scrim').classList.remove('on')}
document.getElementById('scrim').onclick=sheetClose;
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){go(b.dataset.v)}});
load();
applyNewOrder();
rebuildDays();go('plan','week');
if('serviceWorker' in navigator&&location.protocol==='https:'){
  navigator.serviceWorker.getRegistrations().then(function(rs){
    return Promise.all(rs.map(function(r){return r.unregister()}));
  }).then(function(){
    return caches.keys().then(function(ks){
      return Promise.all(ks.map(function(k){return caches.delete(k)}));
    });
  }).then(function(){
    return navigator.serviceWorker.register('sw.js');
  }).catch(function(){});
}

</script>
