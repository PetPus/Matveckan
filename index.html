<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Matveckan</title>
<style>
:root{
  --ink:#2B1B47; --muted:#7B6A96; --glass:rgba(255,255,255,.58); --glass-hi:rgba(255,255,255,.82);
  --edge:rgba(255,255,255,.72); --hair:rgba(120,70,170,.10);

  --pink:#FF3D92; --pink-lt:#FF8FC0;
  --violet:#8A3FFC; --violet-lt:#BC8CFF;
  --aqua:#00C2D7; --aqua-lt:#6FE6F0;
  --lime:#2FD17A; --lime-lt:#88EEB4;
  --sun:#FFB020; --sun-lt:#FFD873;
  --r:20px;
  --glow:0 6px 16px -10px rgba(120,50,170,.35);

  /* tema – Planera är utgångsläget */
  --t1:#FF3D92; --t2:#8A3FFC; --tdeep:#7A2FE0; --tglow:rgba(160,40,200,.95);
  --hdr:linear-gradient(118deg,rgba(255,61,146,.93) 0%,rgba(138,63,252,.93) 48%,rgba(0,194,215,.9) 100%);
  --bodybg:
    radial-gradient(90% 60% at 8% 0%,   rgba(255,61,146,.40) 0%, rgba(255,61,146,0) 60%),
    radial-gradient(80% 55% at 95% 8%,  rgba(138,63,252,.40) 0%, rgba(138,63,252,0) 58%),
    radial-gradient(85% 60% at 50% 45%, rgba(0,194,215,.22)  0%, rgba(0,194,215,0)  62%),
    radial-gradient(90% 60% at 12% 94%, rgba(255,143,192,.40) 0%, rgba(255,143,192,0) 58%),
    #FFF4FB;
  --rounded:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI Rounded",system-ui,sans-serif;
}
/* Handla – turkos och lime */
body[data-view="shop"]{
  --t1:#00C2D7; --t2:#2FD17A; --tdeep:#0B8FA0; --tglow:rgba(0,180,170,.95);
  --hdr:linear-gradient(118deg,rgba(0,194,215,.93) 0%,rgba(47,209,122,.93) 55%,rgba(255,176,32,.88) 100%);
  --bodybg:
    radial-gradient(90% 60% at 6% 0%,   rgba(0,194,215,.42) 0%, rgba(0,194,215,0) 60%),
    radial-gradient(80% 55% at 96% 10%, rgba(47,209,122,.42) 0%, rgba(47,209,122,0) 58%),
    radial-gradient(85% 60% at 52% 48%, rgba(111,230,240,.26) 0%, rgba(111,230,240,0) 62%),
    radial-gradient(90% 60% at 14% 95%, rgba(255,176,32,.30) 0%, rgba(255,176,32,0) 58%),
    #F2FDFB;
}
/* Laga – sol och korall */
body[data-view="cook"]{
  --t1:#FFB020; --t2:#FF5C7A; --tdeep:#D2541F; --tglow:rgba(255,120,80,.95);
  --hdr:linear-gradient(118deg,rgba(255,176,32,.95) 0%,rgba(255,92,122,.93) 55%,rgba(138,63,252,.86) 100%);
  --bodybg:
    radial-gradient(90% 60% at 8% 0%,   rgba(255,176,32,.46) 0%, rgba(255,176,32,0) 60%),
    radial-gradient(80% 55% at 95% 8%,  rgba(255,92,122,.40) 0%, rgba(255,92,122,0) 58%),
    radial-gradient(85% 60% at 50% 46%, rgba(255,216,115,.30) 0%, rgba(255,216,115,0) 62%),
    radial-gradient(90% 60% at 12% 95%, rgba(138,63,252,.22) 0%, rgba(138,63,252,0) 58%),
    #FFF8EE;
}
/* Inställningar – violett och turkos */
body[data-view="more"]{
  --t1:#8A3FFC; --t2:#00C2D7; --tdeep:#5B2BBF; --tglow:rgba(120,60,220,.95);
  --hdr:linear-gradient(118deg,rgba(138,63,252,.93) 0%,rgba(0,194,215,.9) 100%);
}
html{background:#FFF4FB}
html[data-view="shop"]{background:#F2FDFB}
html[data-view="cook"]{background:#FFF8EE}
html[data-view="more"]{background:#FFF4FB}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;padding:0}
body{
  color:var(--ink);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(88px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;
  background:transparent;
}
/* ljusslinga + lite korn */
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:var(--bodybg);transform:translateZ(0);
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    repeating-radial-gradient(circle at 6px 6px, rgba(255,255,255,.55) 0 1.4px, rgba(255,255,255,0) 2.6px);
  background-size:34px 34px;opacity:.5;transform:translateZ(0);
}
main,header,nav,.sheet,.scrim,.toast,.fab{position:relative;z-index:1}

h1,h2,h3{margin:0;font-family:var(--rounded);font-weight:800;letter-spacing:-.015em}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;font-family:inherit}

/* ---- entrébågen ---- */
header{
  position:sticky;top:0;z-index:20;color:#fff;
  padding:calc(14px + env(safe-area-inset-top)) 18px 16px;
  display:flex;align-items:center;gap:12px;
  background:var(--hdr);
  box-shadow:0 10px 30px -14px rgba(120,30,140,.8);
}
header::after{
  content:'';position:absolute;left:0;right:0;bottom:-9px;height:10px;
  background:repeating-linear-gradient(90deg,
    var(--sun) 0 16px, var(--pink) 16px 32px, var(--aqua) 32px 48px, var(--lime) 48px 64px);
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 10px,transparent 10px 20px);
          mask:repeating-linear-gradient(90deg,#000 0 10px,transparent 10px 20px);
  opacity:.95;
}
header h1{font-size:25px;text-shadow:0 2px 10px rgba(80,20,110,.35)}
header .sub{font-family:-apple-system,sans-serif;font-size:12px;color:rgba(255,255,255,.86);
  display:block;font-weight:500;letter-spacing:.01em;margin-top:3px}
header .gear{width:38px;height:38px;display:grid;place-items:center;color:#fff;border-radius:50%;
  background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45)}
header .gear svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}

main{padding:22px 16px 32px;max-width:640px;margin:0 auto}
.view{display:none}.view.on{display:block}

/* ---- glasdisken ---- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(255,253,254,.96);
  border-top:1px solid var(--edge);
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
}
nav button{padding:8px 2px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;
  align-items:center;gap:4px;border-radius:16px;font-weight:600}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#fff;background:linear-gradient(135deg,var(--t1),var(--t2));
  box-shadow:0 8px 20px -8px var(--tglow)}

/* ---- glasburkar ---- */
.card{
  background:rgba(255,255,255,.8);
  border:1px solid var(--edge);border-radius:var(--r);
}
.sec-title{font-family:var(--rounded);font-size:15px;font-weight:800;color:var(--ink);
  margin:30px 0 11px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-title:first-child{margin-top:4px}
.sec-title button{font-size:13px;color:var(--tdeep);font-weight:700}

/* ---- karuselltickets ---- */
.btn{
  font-family:var(--rounded);border-radius:999px;padding:14px 22px;font-weight:800;font-size:15.5px;color:#fff;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:linear-gradient(135deg,var(--t1) 0%,var(--t2) 100%);
  box-shadow:0 10px 26px -10px var(--tglow);
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:active{transform:scale(.96);box-shadow:0 6px 14px -10px var(--tglow)}
.btn.quiet{color:var(--ink);background:var(--glass-hi);
  border:1px solid var(--edge);box-shadow:0 6px 18px -12px rgba(120,50,170,.6);font-weight:700}
.btn.danger{color:#fff;background:linear-gradient(135deg,#FF5C7A,#E01E5A);
  box-shadow:0 10px 26px -12px rgba(224,30,90,.95)}
.btn.wide{width:100%}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.tiny{font-size:12.5px;color:var(--muted);line-height:1.5}

/* ---- färgade glasbitar ---- */
.pill{display:inline-block;font-family:var(--rounded);font-size:11px;padding:4px 10px;border-radius:999px;
  font-weight:800;white-space:nowrap;color:#fff;background:linear-gradient(135deg,var(--t2),var(--t1));
  box-shadow:0 4px 12px -6px var(--tglow)}
.pill.box,.pill.late{background:linear-gradient(135deg,var(--sun),#FF8A3D);box-shadow:0 4px 12px -6px rgba(255,138,61,.9)}
.pill.r{background:linear-gradient(135deg,var(--lime),var(--aqua));margin-left:5px}
.pill.q{background:linear-gradient(135deg,#FF5C7A,#E01E5A);margin-left:5px}
.pill.act{background:linear-gradient(135deg,var(--aqua),var(--violet))}

input[type=text],input[type=number],input[type=date],textarea,select{
  width:100%;background:rgba(255,255,255,.86);border:1px solid var(--edge);border-radius:14px;padding:13px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--t2);
  box-shadow:0 0 0 4px var(--tglow);box-shadow:0 0 0 4px rgba(138,63,252,.16)}
.empty{text-align:center;color:var(--muted);padding:36px 20px;font-size:14.5px}

.subtabs{display:flex;gap:5px;margin-bottom:24px;padding:5px;border-radius:999px;
  background:rgba(255,255,255,.6);border:1px solid var(--edge)}
.subtabs button{flex:1;padding:10px 2px;border-radius:999px;font-size:14px;color:var(--muted);font-weight:600}
.subtabs button.on{color:#fff;font-weight:800;background:linear-gradient(135deg,var(--t2),var(--t1));
  box-shadow:0 8px 18px -10px var(--tglow)}

.day{margin-bottom:18px}
.day-head{display:flex;align-items:baseline;gap:9px;padding:0 6px 9px}
.day-head b{font-family:var(--rounded);font-size:18px;font-weight:800}
.dish{display:flex;gap:12px;padding:15px;border-top:1px solid var(--hair);align-items:flex-start}
.dish:first-child{border-top:0}
.dish .nm{font-weight:650;line-height:1.35}
.dish .meta{font-size:12.5px;color:var(--muted);margin-top:7px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.dish .x,.slist .x{color:#BBA7D4;font-size:23px;line-height:1;padding:0 2px}
.addrow{padding:13px 15px;border-top:1px solid var(--hair);background:rgba(255,255,255,.35)}
.addrow button{color:var(--tdeep);font-weight:800;font-size:14.5px;font-family:var(--rounded)}

.rlist button.item{display:flex;width:100%;text-align:left;gap:10px;padding:15px;border-top:1px solid var(--hair);align-items:center}
.rlist button.item:first-child{border-top:0}
.rlist .item .nm{font-weight:650}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}
.chip{padding:9px 15px;border-radius:999px;font-size:14px;white-space:nowrap;color:var(--muted);font-weight:600;
  background:rgba(255,255,255,.8);border:1px solid var(--edge)}
.chip.on{color:#fff;font-weight:800;border-color:transparent;
  background:linear-gradient(135deg,var(--t1),var(--t2));box-shadow:0 8px 18px -10px var(--tglow)}

.slist{margin:0;padding:0}
.slist li{list-style:none;display:flex;gap:13px;padding:14px 15px;border-top:1px solid var(--hair);align-items:center}
.slist li:first-child{border-top:0;border-radius:var(--r) var(--r) 0 0}
.slist li:last-child{border-radius:0 0 var(--r) var(--r)}

/* slipat glas som bock */
.box{width:24px;height:24px;flex:0 0 24px;display:grid;place-items:center;
  clip-path:polygon(50% 0,100% 32%,82% 100%,18% 100%,0 32%);
  background:linear-gradient(150deg,rgba(255,255,255,.95),rgba(190,170,220,.55))}
.box.on{background:linear-gradient(150deg,var(--lime-lt) 0%,var(--lime) 50%,var(--aqua) 100%)}
.box svg{width:12px;height:12px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;display:none;margin-top:2px}
.box.on svg{display:block}
.done .txt{color:#A595BC}
.done .txt b{font-weight:400;text-decoration:line-through}
.qty{color:var(--muted);font-variant-numeric:tabular-nums}
.src{font-size:12px;color:var(--muted);margin-top:4px}
.src .sug{font-weight:800;color:var(--tdeep);font-family:var(--rounded)}
.qrow{display:flex;align-items:center;gap:8px;margin-top:9px}
.srcbtn{display:block;width:100%;text-align:left;background:none;border:0;padding:0;font:inherit;cursor:pointer}
.nmrow{display:flex;align-items:baseline;gap:10px}
.nmt{font-weight:650;flex:1;min-width:0}
.buy{font-family:var(--rounded);font-size:17px;font-weight:800;color:var(--ink);white-space:nowrap;letter-spacing:-.01em}
.buy.mine{color:var(--tdeep)}
.done .buy{color:#B9AECB;text-decoration:line-through;font-weight:600}
.src.srcbtn,.src{font-weight:500}
.src .mvd{font-weight:800;color:var(--blush-deep)}
.src.snz{font-weight:700;color:var(--butter-deep)}
.qbox.lite{opacity:.8}
.qbox.lite .qnum{min-width:36px;font-size:14px;color:var(--muted)}
.src .more{font-weight:700;color:var(--tdeep);white-space:nowrap}
.src .sug.none{font-weight:600;color:var(--muted);font-style:italic;font-family:inherit}

.ord{display:flex;flex-direction:column;gap:3px}
.ord button{width:31px;height:21px;border-radius:7px;font-size:10px;color:var(--tdeep);
  background:rgba(255,255,255,.8);border:1px solid var(--edge)}
.mv{font-family:var(--rounded);font-size:12px;color:var(--tdeep);font-weight:800;white-space:nowrap;
  border-radius:999px;padding:8px 12px;background:rgba(255,255,255,.82);border:1px solid var(--edge)}
.mv.hint{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--lime),var(--aqua));
  box-shadow:0 6px 14px -8px rgba(0,180,160,.9)}
.pos{min-width:44px;height:34px;padding:0 8px;text-align:center;font-size:13px;font-weight:800;
  font-variant-numeric:tabular-nums;border-radius:11px;color:var(--tdeep);background:rgba(255,255,255,.9);border:1px solid var(--edge)}
.qbox{display:flex;align-items:center;border-radius:999px;flex:0 0 auto;
  background:rgba(255,255,255,.82);border:1px solid var(--edge)}
.qbox button{width:32px;height:34px;font-size:17px;color:var(--tdeep);font-weight:800}
.qbox .qnum{min-width:58px;padding:0 4px;white-space:nowrap;height:34px;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;
  color:var(--ink);font-weight:700}

.daygrid{display:grid;gap:6px;margin-bottom:16px}
.daygrid button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:10px 2px 9px;border-radius:16px;font-family:var(--rounded);color:var(--muted);
  background:rgba(255,255,255,.72);border:1px solid var(--edge)}
.daygrid b{font-size:14px;font-weight:800;color:var(--ink)}
.daygrid i{font-style:normal;font-size:10.5px;font-weight:700}
.daygrid u{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;
  background:var(--t1);text-decoration:none}
.daygrid button.empty{opacity:.55}
.daygrid button.done i{color:var(--lime)}
.daygrid button.on{border-color:transparent;background:linear-gradient(135deg,var(--t1),var(--t2));
  box-shadow:0 8px 18px -10px var(--tglow)}
.daygrid button.on b,.daygrid button.on i{color:#fff}
.daygrid button.on u{background:#fff}
.daysel{display:flex;gap:8px;overflow-x:auto;padding-bottom:14px}
.daysel button{flex:0 0 auto;padding:9px 14px;border-radius:999px;font-size:14px;color:var(--muted);font-weight:600;
  background:rgba(255,255,255,.72);border:1px solid var(--edge)}
.daysel button.on{color:#fff;font-weight:800;border-color:transparent;
  background:linear-gradient(135deg,var(--t1),var(--t2));box-shadow:0 8px 18px -10px var(--tglow)}

.ing{margin:0;padding:0}
.ing li{list-style:none;padding:13px 15px;border-top:1px solid var(--hair);display:flex;gap:13px}
.ing li:first-child{border-top:0}
.stepper{display:flex;align-items:center;border-radius:999px;
  background:rgba(255,255,255,.82);border:1px solid var(--edge)}
.stepper button{width:42px;height:42px;font-size:20px;color:var(--tdeep);font-weight:800}
.stepper span{min-width:38px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}

.wknav{display:flex;align-items:center;gap:11px;margin-bottom:20px}
.wknav .lbl{flex:1;text-align:center;font-family:var(--rounded);font-size:19px;font-weight:800;
  padding:10px 6px;border-radius:16px}
.wknav button.arw{width:46px;height:46px;border-radius:50%;font-size:19px;color:var(--tdeep);font-weight:800;
  background:rgba(255,255,255,.82);border:1px solid var(--edge);box-shadow:var(--glow)}
.wkcard{margin-bottom:28px}
.wkcard h3{font-size:18px;margin-bottom:12px;display:flex;align-items:center;gap:8px}

.irow{display:grid;grid-template-columns:62px 86px 1fr 26px;gap:7px;margin-bottom:9px;align-items:center}
.irow input,.irow select{padding:11px 8px;border-radius:12px}
.irow .x{font-size:21px;color:#BBA7D4;text-align:center}

.anch{height:0;scroll-margin-top:calc(var(--hh,72px) + 12px)}
.stick{position:sticky;top:calc(var(--hh,72px) + 8px);z-index:15;background:#fff;border-radius:12px;
  padding:10px 12px;border-left:5px solid var(--sc);box-shadow:0 6px 14px -10px rgba(60,25,90,.45)}
.sec-title.stick{margin:24px -2px 10px}
.stick.sub{font-family:var(--rounded);font-size:13.5px;font-weight:800;color:var(--ink);margin:14px -2px 6px;padding:8px 12px}
.s-fram{--sc:#1E9E55}.s-willys{--sc:#E2231A}.s-other{--sc:#8A3FFC}.s-later{--sc:#F2A20C}
.rail{position:fixed;right:2px;top:calc(96px + env(safe-area-inset-top));bottom:calc(168px + env(safe-area-inset-bottom));
  z-index:34;display:none;flex-direction:column;justify-content:space-between;
  padding:8px 3px;border-radius:999px;touch-action:none;user-select:none;-webkit-user-select:none;
  background:rgba(255,255,255,.9);border:1px solid var(--edge)}
.rail.on{display:flex}
body[data-rail="1"] main{padding-right:40px}
.rail.drag{background:rgba(255,255,255,.85)}
.rail button{flex:1;width:26px;min-height:0;font-size:12px;font-weight:800;color:var(--tdeep);
  line-height:1;font-family:var(--rounded);border-radius:999px;display:grid;place-items:center}
.rail button.off{color:#C6B6DA}
.rail button.hit{color:#fff;background:linear-gradient(135deg,var(--t1),var(--t2));transform:scale(1.35)}
.fabbar{position:fixed;right:12px;left:12px;bottom:calc(98px + env(safe-area-inset-bottom));z-index:35;
  display:none;justify-content:flex-end;align-items:center;gap:7px;pointer-events:none}
.fabbar.on{display:flex}
.fabbar button{pointer-events:auto}
.jump{font-family:var(--rounded);font-size:13px;font-weight:800;color:var(--tdeep);white-space:nowrap;
  padding:12px 14px;border-radius:999px;background:rgba(255,255,255,.95);
  border:1px solid var(--edge);box-shadow:0 10px 24px -12px rgba(60,25,90,.55)}
.jump:active{transform:scale(.95)}
.jump.round{width:44px;height:44px;padding:0;display:grid;place-items:center;font-size:18px}
.jump.find{width:52px;height:52px;border:0;background:linear-gradient(135deg,var(--sun),var(--t1));
  box-shadow:0 10px 22px -10px var(--tglow)}
.jump.find svg{width:24px;height:24px;stroke:#fff;stroke-width:2.6;fill:none;stroke-linecap:round}
.mv.miss{color:var(--blush-deep)}
.fab{position:relative;z-index:35;display:none;padding:11px 14px!important;font-size:13px!important;
  font-family:var(--rounded);color:#fff;border-radius:999px;padding:14px 22px;font-size:14.5px;font-weight:800;
  background:linear-gradient(135deg,var(--pink),#E01E5A);box-shadow:0 14px 30px -10px rgba(224,30,90,.95)}
.fab.on{display:block}
.fab.active{background:linear-gradient(135deg,var(--lime),var(--aqua));
  box-shadow:0 14px 30px -10px rgba(0,180,170,.95)}

.scrim{position:fixed;inset:0;background:rgba(60,25,90,.42);z-index:40;display:none;backdrop-filter:blur(6px)}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;border-radius:30px 30px 0 0;
  background:rgba(255,250,254,.86);backdrop-filter:blur(26px) saturate(1.5);
  border-top:1px solid var(--edge);
  max-height:90vh;overflow:auto;display:none;transition:transform .18s ease;
  padding:12px 20px calc(28px + env(safe-area-inset-bottom));

function todayKey(){return ['sun','mon','tue','wed','thu','fri','sat'][new Date().getDay()]}
function gotoToday(){
  var weeks=S.activeWeeks,wpos=-1,idx=-1;
  /* finns ett startdatum vet vi exakt vilken vecka och dag idag är */
  if(S.periodStart){
    var st=new Date(S.periodStart+'T12:00:00'),now=new Date();now.setHours(12,0,0,0);
    var off=Math.round((now-st)/86400000);
    if(off<0){wpos=0;idx=0}            /* perioden har inte börjat: visa första dagen */
    else{
      var p=Math.floor(off/7),d=off%7;
      if(p<weeks.length&&d<DAYS.length){wpos=p;idx=d}
    }
  }
  if(idx<0){
    idx=DAYS.map(function(x){return x[0]}).indexOf(todayKey());
    wpos=Math.max(0,weeks.indexOf(cookWeekNo()));
  }
  if(idx<0)return;
  /* gå framåt så länge dagens rätter redan är lagade */
  for(var guard=0;guard<70;guard++){
    var key=DAYS[idx][0];
    if(!dayDone(weeks[wpos],key))break;
    if(idx+1<DAYS.length)idx++;
    else if(wpos+1<weeks.length){wpos++;idx=0}
    else break;
  }
  S.cookWeek=weeks[wpos];S.cookDay=DAYS[idx][0];S.cookTab=0;
  var l=dayDishes(S.cookWeek,S.cookDay);
  for(var i=0;i<l.length;i++)if(needsCooking(l[i])&&!isCooked(S.cookWeek,S.cookDay,l[i])){S.cookTab=i;break}
}
function needsCooking(d){return !d.meal||d.meal==='middag'||d.meal==='lunch'}
/* dagen är klar när lunch och middag är lagade – frukost och mellanmål räknas inte */
function dayDone(wn,key){
  var list=dayDishes(wn,key);
  if(!list.length)return false;
  var main=list.filter(needsCooking);
  var check=main.length?main:list;
  return check.every(function(x){return isCooked(wn,key,x)});
}

    '<div class="tiny" style="margin:-6px 0 12px">Tryck för att öppna. Bock betyder att veckan ingår i inköpen.</div>';
  S.weeks.slice().sort(function(a,b){return a.n-b.n}).forEach(function(w){
    h+='<button class="btn quiet wide" style="margin-bottom:8px;justify-content:space-between" '+
       'onclick="gotoWeek('+w.n+')"><span>'+(isActive(w.n)?'&#10003; ':'')+'Vecka '+w.n+'</span>'+
       '<span class="tiny">'+dishCount(w)+' rätter</span></button>';
  });
  h+='<button class="btn wide" style="margin-top:4px" onclick="sheetClose();addWeek()">Ny tom vecka</button>';
  sheetOpen(h);
}
function gotoWeek(n){S.editWeek=n;save();sheetClose();render();window.scrollTo(0,0)}
function dupWeek(n){
  var src=wk(n);if(!src)return;
  var m=1;S.weeks.forEach(function(w){if(w.n>=m)m=w.n+1});
  var copy={n:m,days:JSON.parse(JSON.stringify(src.days))};
  DAYS.forEach(function(d){(copy.days[d[0]]||[]).forEach(function(x){x.id=uid()})});
  S.weeks.push(copy);S.editWeek=m;save();render();window.scrollTo(0,0);
  toast('Vecka '+n+' kopierad till vecka '+m);
}
function delWeek(n){
  if(S.weeks.length<2){toast('Minst en vecka måste finnas');return}
  if(!confirm('Ta bort vecka '+n+' helt? Rätterna i den försvinner.'))return;
  S.weeks=S.weeks.filter(function(w){return w.n!==n});
  S.activeWeeks=S.activeWeeks.filter(function(x){return x!==n});
  if(!S.activeWeeks.length)S.activeWeeks=[S.weeks[0].n];
  DAYS.forEach(function(d){delete S.temp[tkey(n,d[0])]});
  if(S.editWeek===n)S.editWeek=S.weeks[0].n;
  resetPeriod();
  save();render();toast('Vecka '+n+' borttagen');
}
function stepWeek(d){
  var i=S.weeks.indexOf(wk(S.editWeek))+d;
  if(i<0||i>=S.weeks.length)return;
  S.editWeek=S.weeks[i].n;save();render();window.scrollTo(0,0);
}
/* ny period: bockar, "finns hemma" och kompletteringsval gäller bara den period de gjordes i.
   Butiksvalen ligger kvar – en vara du fördelat en gång behöver inte fördelas igen. */
function resetPeriod(){
  S.checked={};S.later={};S.cooked={};S.tmpMove={};S.snooze={};
  for(var k in S.approved)if(S.approved[k]===false)delete S.approved[k];
}
function nextStartDate(){
  var want=CYC.indexOf(S.startDay||'wed'),d=new Date();d.setHours(12,0,0,0);
  for(var i=0;i<7;i++){if((d.getDay()+6)%7===want)return iso(d);d.setDate(d.getDate()+1)}
  return iso(new Date());
}
function snapStart(v){
  if(!v)return v;
  var d=new Date(v+'T12:00:00'),want=CYC.indexOf(S.startDay||'wed');
  for(var i=0;i<7;i++){if((d.getDay()+6)%7===want)return iso(d);d.setDate(d.getDate()-1)}
  return v;
}
function prettyDate(v){
  if(!v)return '';
  var d=new Date(v+'T12:00:00');
  return ['sön','mån','tis','ons','tors','fre','lör'][d.getDay()]+' '+d.getDate()+' '+
    ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt','nov','dec'][d.getMonth()];
}
function toggleActive(n){
  var before=S.activeWeeks[0];
  var a=S.activeWeeks,i=a.indexOf(n);
  if(i>-1){
    if(a.length===1){toast('Minst en vecka måste vara aktiv');return}
    a.splice(i,1);
  }else{
    a.push(n);a.sort(function(x,y){return x-y});
  }
  if(a[0]!==before)S.periodStart=nextStartDate();
  resetPeriod();save();render();
  toast('Handlar för '+actLabel());
}
/* perioden räknat i dagar: veckoblock om sju dagar plus de valda dagarna */
function periodDays(){return (S.activeWeeks.length-1)*7+DAYS.length}
function periodText(){
  return DAYS[0][1]+'–'+DAYS[DAYS.length-1][1].toLowerCase()+
    (S.activeWeeks.length>1?' i '+S.activeWeeks.length+' veckor':'')+
    ' · '+periodDays()+' dagar';
}
/* lägg till eller ta bort veckor framåt från den du står på */
function setWeekSpan(from,n){
  var all=S.weeks.slice().sort(function(a,b){return a.n-b.n}),
      i=all.map(function(w){return w.n}).indexOf(from),out=[];
  if(i<0)i=0;
  for(var k=0;k<n&&i+k<all.length;k++)out.push(all[i+k].n);
  if(!out.length)return;
  if(out[0]!==S.activeWeeks[0])S.periodStart=nextStartDate();
  S.activeWeeks=out;resetPeriod();
  save();render();toast('Handlar för '+actLabel());
}
function addWeek(){
  var n=1;S.weeks.forEach(function(w){if(w.n>=n)n=w.n+1});
  S.weeks.push({n:n,days:emptyWeek()});S.editWeek=n;save();render();toast('Vecka '+n+' skapad');
}
function clearWeek(n){
  if(!confirm('Töm vecka '+n+'?'))return;
  var w=wk(n);if(!w)return;
  w.days=emptyWeek();if(isActive(n)){resetPeriod()}
  save();render();
}

function addDish(wn,day){
  var opt=function(r){
    var p=placeLabel(r.id,3);
    return '<option value="'+r.id+'">'+esc(r.name)+(p?'  ·  '+esc(p):'')+'</option>';
  };

    '<div class="field"><label>Portioner</label><input type="number" id="f_p" value="4" min="1" max="30"></div>'+
    '<div class="field"><label>Måltid</label><select id="f_m">'+mealOpts('middag')+'</select></div>'+
    '<div class="field"><label>Egen text, valfritt</label><input type="text" id="f_t" placeholder="t.ex. Rester pizza"></div>'+
    '<div class="field"><label class="row" style="gap:9px"><input type="checkbox" id="f_b" style="width:auto" checked> Extra för matlåda</label></div>'+
    '<button class="btn wide" onclick="saveDish('+wn+',\''+day+'\')">Lägg till</button>');
}
/* ---- permanent eller bara denna gång ---- */
function idxOf(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return i;return -1}
function clone(o){return JSON.parse(JSON.stringify(o))}
/* permanent ändrar standardveckan – och den tillfälliga versionen om dagen har en,
   så att det du ser stämmer, utan att tillfälliga rätter blir permanenta */
function applyTo(wn,day,scope,fn){
  if(scope==='once'){fn(makeTemp(wn,day));return}
  var w=wk(wn);if(!w)return;
  w.days[day]=w.days[day]||[];
  fn(w.days[day]);
  var t=S.temp[tkey(wn,day)];
  if(t)fn(t);
}
function scopeAsk(title,what){
  sheetOpen('<h2>'+title+'</h2>'+
    '<div class="tiny" style="margin:-6px 0 14px">'+what+'</div>'+
    '<button class="btn wide" style="margin-bottom:8px" onclick="runPending(\'perm\')">Permanent</button>'+
    '<div class="tiny" style="margin:-4px 0 12px">Ändrar standardveckan, så det gäller varje gång veckan kommer tillbaka.</div>'+
    '<button class="btn quiet wide" style="margin-bottom:8px" onclick="runPending(\'once\')">Bara denna gång</button>'+
    '<div class="tiny" style="margin:-4px 0 12px">Standardveckan ligger kvar och dagen kan återställas.</div>'+
    '<button class="btn quiet wide" onclick="window._pa=null;sheetClose()">Avbryt</button>');
}
function runPending(scope){
  var p=window._pa;if(!p)return;
  var msg='';
  if(p.kind==='add'){
    applyTo(p.wn,p.day,scope,function(a){a.push(clone(p.dish))});
    msg='Tillagd';
  }else if(p.kind==='del'){
    applyTo(p.wn,p.day,scope,function(a){var j=idxOf(a,p.id);if(j>-1)a.splice(j,1)});
    msg='Borttagen';
  }else if(p.kind==='move'){
    var moved=clone(p.dish);
    for(var k in p.props)moved[k]=p.props[k];
    applyTo(p.wn,p.day,scope,function(a){var j=idxOf(a,p.id);if(j>-1)a.splice(j,1)});
    applyTo(p.nw,p.nd,scope,function(a){a.push(clone(moved))});
    msg='Flyttad till '+dayName(p.nd)+' vecka '+p.nw;
  }
  window._pa=null;save();sheetClose();render();
  toast(msg+(scope==='once'?' – bara denna gång':''));
}
function saveDish(wn,day){
  var dish={id:uid(),recipeId:document.getElementById('f_r').value,
    portions:parseInt(document.getElementById('f_p').value,10)||4,
    meal:document.getElementById('f_m').value,text:document.getElementById('f_t').value.trim(),
    matlada:document.getElementById('f_b').checked};
  window._pa={kind:'add',wn:wn,day:day,dish:dish};
  scopeAsk('Lägg till '+esc(dishName(dish)),dayName(day)+' i vecka '+wn+'.');
}
function dayOrderAll(){
  var keys=DAYS.map(function(d){return d[0]});
  CYC.forEach(function(k){if(keys.indexOf(k)<0)keys.push(k)});
  return keys;
}
/* var i rotationen en rätt redan ligger, t.ex. ["Ons v1","Fre v3"] */
function placements(rid){
  var out=[],seen={};
  S.weeks.slice().sort(function(a,b){return a.n-b.n}).forEach(function(w){
    dayOrderAll().forEach(function(k){
      var list=S.temp[tkey(w.n,k)]||w.days[k]||[];
      list.forEach(function(x){
        if(x.recipeId!==rid)return;
        var lab=labelOf(k).slice(0,3)+' v'+w.n;
        if(!seen[lab]){seen[lab]=1;out.push(lab)}
      });
    });
  });
  return out;
}
function placeLabel(rid,max){
  var p=placements(rid);
  if(!p.length)return '';
  if(max&&p.length>max)return p.slice(0,max).join(', ')+' +'+(p.length-max);
  return p.join(', ');
}
var MEALS=[['frukost','Frukost'],['lunch','Lunch'],['mellanmal','Mellanmål'],['middag','Middag']];
function mealLabel(m){
  for(var i=0;i<MEALS.length;i++)if(MEALS[i][0]===m)return MEALS[i][1];
  return 'Middag';
}
function mealOpts(sel){
  return MEALS.map(function(m){
    return '<option value="'+m[0]+'"'+(m[0]===(sel||'middag')?' selected':'')+'>'+m[1]+'</option>';
  }).join('');
}
function weekOpts(sel){return S.weeks.map(function(w){
  return '<option value="'+w.n+'"'+(w.n===sel?' selected':'')+'>Vecka '+w.n+'</option>'}).join('')}
function dayOpts(sel){return DAYS.map(function(d){
  return '<option value="'+d[0]+'"'+(d[0]===sel?' selected':'')+'>'+d[1]+'</option>'}).join('')}
function editDish(wn,day,i){
  var d=dayDishes(wn,day)[i];if(!d)return;
  sheetOpen('<h2>'+esc(dishName(d))+'</h2>'+
    '<div class="tiny" style="margin:-6px 0 12px">Ligger på '+dayName(day)+' i vecka '+wn+'</div>'+
    '<div class="field"><label>Vecka</label><select id="m_w">'+weekOpts(wn)+'</select></div>'+
    '<div class="field"><label>Veckodag</label><select id="m_d">'+dayOpts(day)+'</select></div>'+
    '<div class="field"><label>Måltid</label><select id="m_m">'+mealOpts(d.meal)+'</select></div>'+
    '<div class="field"><label>Portioner</label><input type="number" id="m_p" min="1" max="30" value="'+d.portions+'"></div>'+
    '<div class="field"><label class="row" style="gap:9px"><input type="checkbox" id="m_b" style="width:auto"'+(d.matlada?' checked':'')+'> Extra för matlåda</label></div>'+
    '<button class="btn wide" onclick="applyEdit('+wn+',\''+day+'\','+i+')">Spara</button>'+
    '<button class="btn danger wide" style="margin-top:9px" onclick="delDish('+wn+',\''+day+'\','+i+')">Ta bort rätten</button>');
}
function applyEdit(wn,day,i){
  var arr=dayDishes(wn,day),d=arr[i];if(!d)return;
  var nw=parseInt(document.getElementById('m_w').value,10),nd=document.getElementById('m_d').value,
      props={meal:document.getElementById('m_m').value,
             portions:parseInt(document.getElementById('m_p').value,10)||4,
             matlada:document.getElementById('m_b').checked};
  if(nw!==wn||nd!==day){
    if(!d.id)d.id=uid();
    window._pa={kind:'move',wn:wn,day:day,id:d.id,dish:clone(d),nw:nw,nd:nd,props:props};
    scopeAsk('Flytta '+esc(dishName(d)),'Från '+dayName(day)+' vecka '+wn+' till '+dayName(nd)+' vecka '+nw+'.');
    return;
  }
  for(var k in props)d[k]=props[k];
  save();sheetClose();render();toast('Sparad');
}
function delDish(wn,day,i){
  var d=dayDishes(wn,day)[i];if(!d)return;
  if(!d.id){d.id=uid();save()}
  window._pa={kind:'del',wn:wn,day:day,id:d.id};
  scopeAsk('Ta bort '+esc(dishName(d)),dayName(day)+' i vecka '+wn+'.');
}

/* ---------------- recept ---------------- */
function planRecipes(){
  var f=window._rf||'middag';
  if(f==='lunch&mellanmal')f='lunch';
  var list=S.recipes.filter(function(r){return hasType(r,f)}).sort(function(a,b){return a.name.localeCompare(b.name,'sv')});
  var h='<div class="chips" style="margin-bottom:12px">'+
    CATS.map(function(c){
      var n=S.recipes.filter(function(r){return hasType(r,c[0])}).length;
      return '<button class="chip'+(f===c[0]?' on':'')+'" onclick="window._rf=\''+c[0]+'\';render()">'+
        c[1]+' <span style="opacity:.6">'+n+'</span></button>';
    }).join('')+'</div>'+
    '<button class="btn wide" style="margin-bottom:14px" onclick="newRecipe()">+ Nytt recept</button>'+
    '<div class="card rlist">';
  if(!list.length)h+='<div class="empty">Inga recept här än</div>';
  list.forEach(function(r){
    h+='<button class="item" onclick="openRecipe(\''+r.id+'\')"><span class="grow"><span class="nm">'+esc(r.name)+'</span>'+
       '<div class="tiny">'+(r.ing.length?r.ing.length+' ingredienser':'Ingen ingredienslista')+'</div>'+
       (placements(r.id).length?'<div class="tiny" style="margin-top:3px"><span class="pill">'+
         esc(placeLabel(r.id,4))+'</span></div>':'')+
       '</span><span class="tiny">&rsaquo;</span></button>';
  });
  h+='</div>';
  return h;
}
function allUnits(){
  var out=UNITS.slice();
  (S.units||[]).forEach(function(u){if(out.indexOf(u)<0)out.push(u)});
  return out;
}
function unitOpts(sel,withNew){
  var h=allUnits().map(function(u){
    return '<option value="'+esc(u)+'"'+(u===(sel||'')?' selected':'')+'>'+(u===''?'—':esc(u))+'</option>';
  }).join('');
  if(withNew)h+='<option value="__new">+ ny enhet…</option>';
  return h;
}
function unitPick(sel){
  if(sel.value!=='__new'){sel.dataset.prev=sel.value;return}
  var v=(prompt('Ny enhet, till exempel kryddmått eller nypa')||'').trim();
  if(v&&allUnits().indexOf(v)<0){S.units.push(v);save()}
  var keep=v||sel.dataset.prev||'';
  Array.prototype.forEach.call(document.querySelectorAll('select.iu'),function(x){
    var cur=x===sel?keep:x.value;
    x.innerHTML=unitOpts(cur,true);
    x.value=cur;
  });
  if(v)toast('Enheten '+v+' tillagd');
}
function ingRow(ing){

  return '<div class="irow">'+
    '<input type="number" class="iq" step="any" min="0" placeholder="Antal" value="'+(ing.q==null?'':ing.q)+'">'+
    '<select class="iu" onchange="unitPick(this)" data-prev="'+esc(ing.u||'')+'">'+unitOpts(ing.u,true)+'</select>'+
    '<input type="text" class="in" list="ingnames" placeholder="Ingrediens" value="'+esc(ing.n)+'">'+
    '<button class="x" onclick="this.parentNode.remove()">&times;</button></div>';
}
function addIngRow(){

  document.getElementById('ings').appendChild(d.firstChild);

        '<input type="number" id="p_p" value="4" min="1" max="30"></div></div>'+

function placeRecipe(id){
  var wn=parseInt(document.getElementById('p_w').value,10),
      day=document.getElementById('p_d').value,
      meal=document.getElementById('p_m').value,
      port=parseInt(document.getElementById('p_p').value,10)||4,
      cur=dayDishes(wn,day);
  window._pl={id:id,wn:wn,day:day,meal:meal,port:port,target:null};
  if(!cur.length){askScope();return}
  var h='<h2>'+dayName(day)+' vecka '+wn+'</h2>'+
    '<div class="tiny" style="margin:-6px 0 14px">Vad ska '+esc(rec(id).name)+' göra med det som redan ligger där?</div>';
  cur.forEach(function(d,i){
    h+='<button class="btn quiet wide" style="margin-bottom:8px;justify-content:space-between" onclick="pickTarget('+i+')">'+
       '<span>Ersätt '+esc(dishName(d))+'</span>'+
       '<span class="pill">'+mealLabel(d.meal)+'</span></button>';
  });
  h+='<button class="btn wide" style="margin-top:4px" onclick="pickTarget(null)">Lägg till som extra rätt</button>'+
     '<button class="btn quiet wide" style="margin-top:9px" onclick="sheetClose()">Avbryt</button>';
  sheetOpen(h);

function groups(){
  var map={},pending=[],fram=[],willys=[],other=[],skipped=[],k;
  actWeeks().forEach(function(w,pos){
    DAYS.forEach(function(d){
      dayDishes(w.n,d[0]).forEach(function(dish){
        var r=rec(dish.recipeId);if(!r)return;
        var off=dayOffset(d[0],pos);
        r.ing.forEach(function(ing){
          var key=(ing.n+'|'+ing.u).toLowerCase();
          if(!map[key])map[key]={key:key,n:ing.n,u:ing.u,q:null,src:[],off:off};
          var v=scaled(ing,dish.portions,r.bas);
          if(v!=null)map[key].q=(map[key].q||0)+v;
          if(off<map[key].off)map[key].off=off;
          if(map[key].src.indexOf(r.name)<0)map[key].src.push(r.name);
          (map[key].uses=map[key].uses||[]).push({r:r.name,q:v,u:ing.u,wn:w.n,day:d[0],
            meal:dish.meal||'middag',off:off,text:dish.text||''});
        });
      });
    });
  });
  function mkItem(key,m,uses,extra){
    var q=null,src=[];
    uses.forEach(function(x){if(x.q!=null)q=(q||0)+x.q;if(src.indexOf(x.r)<0)src.push(x.r)});
    var off=uses.reduce(function(a,x){return Math.min(a,x.off)},1e9);
    var it={key:key,n:m.n,u:m.u,q:q,parts:[{q:q,u:m.u}],src:src.join(', '),auto:true,
            off:off,fresh:isFresh(m.n),uses:uses};
    for(var e in extra)it[e]=extra[e];
    return it;
  }
  for(k in map){
    var m=map[k],a=S.approved[k],uses=m.uses||[],items=[];
    if(a===undefined)a=shopFor(m.n)||undefined;
    /* färskvara som behövs både tidigt och sent: dela upp mängden */
    var fd=freshDays(m.n),lim=fd-1,early=uses.filter(function(x){return x.off<lim}),
        late=uses.filter(function(x){return x.off>=lim}).sort(function(a,b){return a.off-b.off});
    if(isFresh(m.n)&&S.later[k]===undefined&&late.length){
      /* det som inte ryms i huvudhandlingen delas i omgångar: allt som behövs inom
         hållbarheten från omgångens första dag köps samtidigt */
      var buckets=[];
      late.forEach(function(x){
        var b=buckets[buckets.length-1];
        if(b&&x.off<=b.start+lim)b.uses.push(x);else buckets.push({start:x.off,uses:[x]});
      });
      if(early.length)items.push(mkItem(k,m,early,{forceNow:true}));
      buckets.forEach(function(b,i){
        var key=(i===0&&!early.length)?k:k+'~sen'+(i===0?'':i+1);
        items.push(mkItem(key,m,b.uses,{forceLate:true,lateSplit:true,baseKey:k,round:i+1,rounds:buckets.length}));
      });
    }else items.push(mkItem(k,m,uses,{}));
    items.forEach(function(it){
      if(a==='fram')fram.push(it);
      else if(a==='other')other.push(it);
      else if(a==='willys')willys.push(it);
      else if(a===false)skipped.push(it);
      else{it.hint=shopFor(m.n);pending.push(it)}
    });
  }
  S.extra.forEach(function(e){
    var it={key:'f:'+e.id,n:e.name,u:'',q:null,src:'',manual:e.id};
    if(e.shop==='willys')willys.push(it);else if(e.shop==='other')other.push(it);else fram.push(it);
  });
  pending.sort(bySv);skipped.sort(bySv);
  return{pending:pending,fram:fram,willys:willys,other:other,skipped:skipped};
}

var MASS={g:1,kg:1000},VOL={krm:1,ml:1,tsk:5,msk:15,cl:10,dl:100,l:1000};
function r1(x){return Math.round(x*10)/10}
/* slår ihop mängder i olika enheter: vikt för sig, volym för sig, styck för sig */
function combine(parts){
  var g=0,ml=0,hg=false,hm=false,cnt={},ord=[];
  (parts||[]).forEach(function(p){
    if(p.q==null)return;
    var u=p.u||'';
    if(u==='st')u='';if(u==='klyfta')u='klyftor';   /* samma sak, olika stavning */
    if(MASS[u]!=null){g+=p.q*MASS[u];hg=true}
    else if(VOL[u]!=null){ml+=p.q*VOL[u];hm=true}
    else{if(!(u in cnt)){cnt[u]=0;ord.push(u)}cnt[u]+=p.q}
  });
  var out=[];
  ord.forEach(function(u){out.push({q:cnt[u],u:u})});
  if(hg)out.push(g>=1000?{q:r1(g/1000),u:'kg'}:{q:Math.round(g),u:'g'});
  if(hm)out.push(ml>=1000?{q:r1(ml/1000),u:'l'}:ml>=100?{q:r1(ml/100),u:'dl'}:ml>=15?{q:r1(ml/15),u:'msk'}:{q:r1(ml/5),u:'tsk'});
  return out;
}
function partsText(out){
  return out.map(function(o){return fmtQ(roundBuy(o.q,o.u))+(o.u?' '+o.u:' st')}).join(' + ');
}
function applyParts(it){
  if(!it.parts||!it.parts.length)return;
  var out=combine(it.parts);
  if(!out.length){it.q=null;return}
  it.q=out[0].q;it.u=out[0].u;
  it.mixed=out.length>1;
  it.qText=partsText(out);
}
function mergeByName(list){
  var seen={},out=[];
  list.forEach(function(it){
    /* sen del av en delad färskvara får aldrig slås ihop med huvudlistans rad */
    var k=normName(it.n)+(it.lateSplit?'~'+it.key:''),prev=seen[k];
    if(!prev){seen[k]=it;if(it.parts)it.parts=it.parts.slice();out.push(it);return}
    /* samma vara två gånger: behåll raden, slå ihop mängd och receptmärkning */
    if(it.parts)prev.parts=(prev.parts||[]).concat(it.parts);
    if(it.def!=null&&prev.def==null)prev.def=it.def;
    if(it.off!=null&&(prev.off==null||it.off<prev.off))prev.off=it.off;
    if(it.fresh)prev.fresh=true;
    if(it.auto)prev.auto=true;
    if(it.uses)prev.uses=(prev.uses||[]).concat(it.uses);
    if(it.src)prev.src=prev.src?prev.src+', '+it.src:it.src;
    if(it.manual&&!prev.manual)prev.manual=it.manual;
  });
  out.forEach(applyParts);
  return out;
}

var REMIND_DAYS_DEFAULT=1,REMIND_TIME='0645';
function remindDays(){
  var v=S.remindDays;
  return (typeof v==='number'&&v>=0)?v:REMIND_DAYS_DEFAULT;
}
function bumpRemindDays(d){
  S.remindDays=Math.max(0,Math.min(14,remindDays()+d));

}
function remindDaysText(){
  var d=remindDays();
  return d===0?'samma dag':(d===1?'dagen innan':d+' dagar innan');

function nextStart(){
  var want=CYC.indexOf(S.startDay||'wed'),d=new Date();
  d.setHours(12,0,0,0);
  for(var i=0;i<8;i++){
    var js=(d.getDay()+6)%7;            /* 0 = måndag */
    if(js===want)return d;
    d.setDate(d.getDate()+1);
  }
  return new Date();
}
function iso(d){
  var m=('0'+(d.getMonth()+1)).slice(-2),dd=('0'+d.getDate()).slice(-2);
  return d.getFullYear()+'-'+m+'-'+dd;
}
function stamp(d){return iso(d).replace(/-/g,'')}
function remindList(){
  var g=groups(),all=splitLater(framRows(g)).late.map(function(it){it._s='Fram';return it})
    .concat(splitLater(willysRows(g)).late.map(function(it){it._s='Willys';return it}))
    .concat(splitLater(otherRows(g)).late.map(function(it){it._s=storeOf(it.n);return it}));
  var base=S.periodStart?new Date(S.periodStart+'T12:00:00'):nextStart(),by={},out=[];
  all=all.filter(function(it){return !isOn(it)});   /* redan handlat: ingen påminnelse */
  all.forEach(function(it){
    var need=new Date(base.getTime());need.setDate(need.getDate()+it.off);
    var warn=new Date(need.getTime());warn.setDate(warn.getDate()-remindDays());
    var k=stamp(warn);
    if(!by[k]){by[k]={when:warn,items:[]};out.push(by[k])}
    by[k].items.push({n:it.n,shop:it._s,need:need});
  });
  out.sort(function(a,b){return a.when-b.when});
  return out;
}
function reminderPlan(){
  return remindList().map(function(r){
    return {date:iso(r.when),
            items:r.items.map(function(x){return x.n+' ('+x.shop+')'}),
            need:iso(r.items[0].need)};
  });
}
function icsText(){
  var rows=remindList(),s=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Matveckan//SV','CALSCALE:GREGORIAN'];
  rows.forEach(function(r,i){
    var names=r.items.map(function(x){return x.n}).join(', '),
        body=r.items.map(function(x){
          return x.n+' ('+x.shop+') behövs '+['sön','mån','tis','ons','tor','fre','lör'][x.need.getDay()]+' '+iso(x.need);
        }).join('\\n');
    s.push('BEGIN:VEVENT');
    s.push('UID:matveckan-'+stamp(r.when)+'-'+i+'@matveckan');
    s.push('DTSTAMP:'+stamp(new Date())+'T000000Z');
    s.push('DTSTART:'+stamp(r.when)+'T'+REMIND_TIME+'00');
    s.push('DTEND:'+stamp(r.when)+'T'+REMIND_TIME+'00');
    s.push('SUMMARY:Handla färskvaror: '+names);
    s.push('DESCRIPTION:'+body);
    s.push('BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:Handla färskvaror','END:VALARM');
    s.push('END:VEVENT');
  });
  s.push('END:VCALENDAR');
  return s.join('\r\n');
}

function carryKeys(from,to){
  if(from===to)return;
  ['shopOf','freshOf','freshDays','storeName'].forEach(function(m){
    if(S[m][from]!==undefined&&S[m][to]===undefined)S[m][to]=S[m][from];
    delete S[m][from];
  });
}
function renameItem(key,shop){
  var it=(window._rows||{})[key],v=document.getElementById('rnName').value.trim();
  if(!it||!v)return;
  var before=normName(it.n);
  if(it.standing){
    standingList(shop).forEach(function(x){if(x.id===it.sid)x.name=v});
  }else if(it.manual){
    S.extra.forEach(function(e){if(e.id===it.manual)e.name=v});
  }
  var after=normName(v);
  if(before!==after){
    carryKeys(before,after);
    ['ordFram','ordWillys'].forEach(function(o){
      var i=S[o].indexOf(before);if(i>-1)S[o][i]=after;
    });
  }
  save();sheetClose();render();toast('Omdöpt till '+v);
}
function mergeItem(key,shop){
  var it=(window._rows||{})[key],target=document.getElementById('mgTo').value;
  if(!it||!target)return;
  var from=normName(it.n),to=normName(target);
  if(from===to){sheetClose();return}
  S.alias[from]=to;
  if(it.standing)standingList(shop).forEach(function(x,i,a){if(x.id===it.sid)a.splice(i,1)});
  else if(it.manual)S.extra=S.extra.filter(function(e){return e.id!==it.manual});
  ['ordFram','ordWillys'].forEach(function(o){
    S[o]=S[o].filter(function(x){return x!==from});
  });
  carryKeys(from,to);
  delete S.checked[key];delete S.qty[key];
  save();sheetClose();render();toast(it.n+' slogs ihop med '+target);
}

function moveTo(key,name,shop,label){
  var pre=key.slice(0,2);
  if(pre==='g:'||pre==='a:'||pre==='o:'){
    var sid=key.slice(2),nm='';
    var pull=function(arr){return arr.filter(function(x){if(x.id===sid){nm=x.name;return false}return true})};
    S.grund=pull(S.grund);S.framList=pull(S.framList);S.otherList=pull(S.otherList);
    nm=nm||name;
    if(shop==='fram')S.framList.push({id:uid(),name:nm});
    else if(shop==='willys')S.grund.push({id:uid(),name:nm});
    else S.otherList.push({id:uid(),name:nm,store:label||storeOf(nm)});
  }else if(pre==='f:'){
    var id=key.slice(2);
    S.extra.forEach(function(e){if(e.id===id)e.shop=shop});
  }else S.approved[key]=shop;
  setShop(name,shop);
  if(shop==='other')S.storeName[normName(name)]=label||storeOf(name);
  save();sheetClose();render();
  toast(name+' \u2192 '+(shop==='fram'?'Fram':shop==='willys'?'Willys':(label||storeOf(name))));
}

    '<button class="btn quiet wide" onclick="sheetClose()">Avbryt</button>');
}
var _tn=0;
function doRemove(key,shop){
  var it=(window._rows||{})[key];if(!it)return;
  var e={t:Date.now()*100+(_tn++%100),n:it.n,shop:it.shop||shop,key:key};
  if(it.standing){
    var L=standingList(it.shop||shop),idx=-1;
    for(var i=0;i<L.length;i++)if(L[i].id===it.sid){idx=i;break}
    if(idx<0)return;
    e.kind='standing';e.obj=L[idx];e.idx=idx;e.checked=S.checked[key];e.qty=S.qty[key];
    L.splice(idx,1);
  }else if(it.manual){
    var j=-1;for(var m=0;m<S.extra.length;m++)if(S.extra[m].id===it.manual){j=m;break}
    if(j<0)return;
    e.kind='manual';e.obj=S.extra[j];e.checked=S.checked[key];
    S.extra.splice(j,1);
  }else{
    e.kind='recipe';e.base=String(key).replace(/~sen\d*$/,'');e.prev=S.approved[e.base];
    S.approved[e.base]=false;
  }
  delete S.checked[key];delete S.qty[key];
  S.trash=S.trash||[];S.trash.unshift(e);if(S.trash.length>60)S.trash.length=60;
  save();sheetClose();render();undoBar(it.n+' borttagen',e.t);
}
function restoreTrash(t){
  var tr=S.trash||[],i=-1;
  for(var k=0;k<tr.length;k++)if(tr[k].t===t){i=k;break}
  if(i<0)return;
  var e=tr[i];
  if(e.kind==='standing'){
    var L=standingList(e.shop);L.splice(Math.min(e.idx,L.length),0,e.obj);
    if(e.checked!==undefined)S.checked[e.key]=e.checked;
    if(e.qty!==undefined)S.qty[e.key]=e.qty;
  }else if(e.kind==='manual'){
    S.extra.push(e.obj);if(e.checked!==undefined)S.checked[e.key]=e.checked;
  }else if(e.kind==='recipe'){
    if(e.prev===undefined)delete S.approved[e.base];else S.approved[e.base]=e.prev;
  }
  tr.splice(i,1);save();hideUndo();render();toast(e.n+' är tillbaka');
}
function undoBar(text,t){
  var b=document.getElementById('undo');
  b.innerHTML='<span>'+esc(text)+'</span><button onclick="restoreTrash('+t+')">Ångra</button>';
  b.className='undo on';
  clearTimeout(window._ut);window._ut=setTimeout(hideUndo,6000);
}

function ago(t){
  var m=Math.round((Date.now()-t/100)/60000);
  if(m<1)return 'nyss';if(m<60)return m+' min sedan';
  var h=Math.round(m/60);if(h<24)return h+' tim sedan';
  return Math.round(h/24)+' dagar sedan';
}

     '<div class="stepper"><button onclick="port('+t+',-1)">&minus;</button><span>'+dish.portions+'</span>'+
     '<button onclick="port('+t+',1)">+</button></div></div>'+
     '<button class="btn '+(isCooked(cookWeekNo(),day,dish)?'':'quiet ')+'wide" style="margin-top:12px" '+
     'onclick="toggleCooked('+cookWeekNo()+',\''+day+'\','+t+')">'+
     (isCooked(cookWeekNo(),day,dish)?'&#10003; Lagad':'Markera som lagad')+'</button>'+
     '<div class="row" style="gap:8px;margin-top:9px">'+
     (r?'<button class="btn quiet grow" onclick="openRecipe(\''+r.id+'\')">Ändra receptet</button>':'')+
     '<button class="btn quiet grow" onclick="editDish('+cookWeekNo()+',\''+day+'\','+t+')">Flytta rätten</button></div></div>';
  if(!r||!r.ing.length)h+='<div class="empty">Inga ingredienser sparade för den här rätten.</div>';
  else{
    h+='<div class="card"><ul class="ing">';
    r.ing.forEach(function(ing){
      var v=scaled(ing,dish.portions,r.bas);
      h+='<li><span class="qty" style="min-width:64px">'+(v!=null?fmtQ(v)+' '+esc(ing.u):'')+'</span><span class="grow">'+esc(ing.n)+'</span></li>';
    });
    h+='</ul></div>';
  }
  if(r&&r.howto)h+='<div class="sec-title">Gör så här</div>'+
    '<div class="card" style="padding:14px;white-space:pre-wrap;line-height:1.55">'+esc(r.howto)+'</div>';
  document.getElementById('v-cook').innerHTML=h;
}
function setDay(d){S.cookDay=d;S.cookTab=0;save();var y=window.scrollY;render();window.scrollTo(0,y)}
function setCookWeek(n){S.cookWeek=n;S.cookTab=0;save();render()}
function setTab(i){S.cookTab=i;save();var y=window.scrollY;render();window.scrollTo(0,y)}
function port(i,d){
  var dish=dayDishes(cookWeekNo(),S.cookDay)[i];
  dish.portions=Math.max(1,dish.portions+d);save();render();
}

/* ---------------- inställningar ---------------- */
function renderMore(){
  document.getElementById('v-more').innerHTML=
   '<div class="card" style="padding:15px;margin-bottom:14px">'+
   '<div class="row"><span class="grow">Recept</span><b>'+S.recipes.length+'</b></div>'+
   '<div class="row" style="margin-top:7px"><span class="grow">Veckor i rotationen</span><b>'+S.weeks.length+'</b></div>'+
   '<div class="row" style="margin-top:7px"><span class="grow">Handlar för</span><b>'+S.activeWeeks.join(' + ')+'</b></div>'+
   '<div class="row" style="margin-top:7px"><span class="grow">Fram-listan</span><b>'+S.framList.length+'</b></div>'+
   '<div class="row" style="margin-top:7px"><span class="grow">Willys grundlista</span><b>'+S.grund.length+'</b></div>'+
   '<div class="row" style="margin-top:7px"><span class="grow">Annan butik</span><b>'+S.otherList.length+' i '+knownStores().length+'</b></div></div>'+
   '<div class="sec-title">Planeringsperiod</div>'+
   '<div class="card" style="padding:14px"><div class="row" style="gap:8px">'+
   '<div class="grow"><div class="tiny" style="margin-bottom:5px">Börjar</div>'+
   '<select onchange="setPeriod(this.value,null)">'+ALLDAYS.map(function(d){
     return '<option value="'+d[0]+'"'+(d[0]===S.startDay?' selected':'')+'>'+d[1]+'</option>'}).join('')+'</select></div>'+
   '<div class="grow"><div class="tiny" style="margin-bottom:5px">Slutar</div>'+
   '<select onchange="setPeriod(null,this.value)">'+ALLDAYS.map(function(d){
     return '<option value="'+d[0]+'"'+(d[0]===S.endDay?' selected':'')+'>'+d[1]+'</option>'}).join('')+'</select></div></div>'+
   '<div class="tiny" style="margin-top:9px">En vecka löper '+DAYS[0][1]+' till '+DAYS[DAYS.length-1][1].toLowerCase()+
   ', alltså '+DAYS.length+' dagar. Med '+S.activeWeeks.length+' '+(S.activeWeeks.length===1?'vecka':'veckor')+
   ' blir perioden '+periodDays()+' dagar. Antal veckor väljer du under Planera.<br>'+
   'Dagar utanför perioden döljs, men det som ligger på dem raderas inte.</div></div>'+
   (inFrame()?'<div class="card" style="padding:14px;margin-bottom:16px;border-color:var(--blush)">'+
     '<b style="font-size:14.5px">Data sparas inte säkert här</b>'+
     '<div class="tiny" style="margin-top:6px">Appen körs i en sandlåda som töms när sidan laddas om. '+
     'Kopiera texten nedan till Anteckningar efter varje gång du ändrat något, '+
     'och lägg upp appen på en egen adress så fort du kan.</div></div>':'')+
   '<div class="sec-title">Appversion</div>'+
   '<div class="card" style="padding:14px"><div class="row">'+
     '<span class="grow"><b>Version '+APP_VERSION+'</b>'+
     '<div class="tiny" style="margin-top:4px">Appen startar från telefonens egen kopia och hämtar '+
     'inget från nätet. Tryck här när du vet att en ny version lagts upp.</div></span></div>'+
   '<button class="btn quiet wide" style="margin-top:11px" onclick="updateApp()">Hämta ny version</button></div>'+
   '<div class="sec-title">Säkerhetskopia &middot; kopiera och klistra</div>'+
   '<textarea id="bkText" readonly style="min-height:92px;font-size:11px;font-family:ui-monospace,Menlo,monospace">'+
     esc(JSON.stringify(S))+'</textarea>'+
   '<button class="btn wide" style="margin-top:9px" onclick="copyBackup()">Kopiera säkerhetskopian</button>'+
   '<div class="tiny" style="margin-top:7px">Klistra in i Anteckningar. Texten innehåller allt: veckor, recept, '+
   'butikslistor, färskmärkning, ordning, bockar och antal.</div>'+
   '<div class="sec-title">Återställ från kopierad text</div>'+
   '<textarea id="rsText" placeholder="Klistra in säkerhetskopian här" style="min-height:70px;font-size:11px"></textarea>'+
   '<button class="btn quiet wide" style="margin-top:9px" onclick="restoreBackup()">Återställ</button>'+
   '<div class="sec-title">Säkerhetskopia till fil</div>'+
   '<button class="btn quiet wide" style="margin-bottom:9px" onclick="expData()">Exportera till fil</button>'+
   '<button class="btn quiet wide" onclick="document.getElementById(\'imp\').click()">Importera från fil</button>'+
   '<input type="file" id="imp" accept=".json" style="display:none" onchange="impData(this)">'+
   '<div class="tiny" style="margin-top:8px">Data sparas bara på den här telefonen.</div>'+
   '<div class="sec-title">Rensa</div><button class="btn danger wide" onclick="wipe()">Rensa all data</button>';
}
function setPeriod(st,en){
  if(st)S.startDay=st;
  if(en)S.endDay=en;
  rebuildDays();
  if(!DAYS.filter(function(d){return d[0]===S.cookDay}).length)S.cookDay=DAYS[0][0];
  save();render();toast('Perioden är '+DAYS[0][1]+'–'+DAYS[DAYS.length-1][1]);
}
function daysSinceBackup(){
  if(!S.lastBackup)return null;
  return Math.floor((Date.now()-S.lastBackup)/86400000);
}
function backupBanner(){
  var d=daysSinceBackup();
  if(d!==null&&d<3)return '';
  return '<div class="card" style="padding:12px 14px;margin-bottom:14px;border-color:var(--butter)"><div class="row">'+
    '<span class="grow tiny">'+(d===null
      ? 'Du har ingen säkerhetskopia. Allt du lagt in finns bara i den här telefonen.'
      : 'Senaste säkerhetskopian är '+d+' dagar gammal.')+'</span>'+
    '<button class="mv" onclick="go(\'more\')">Kopiera</button></div></div>';
}
function updateApp(){
  toast('Hämtar…');
  if(!('caches' in window)||!navigator.onLine){
    if(!navigator.onLine){toast('Ingen uppkoppling – försök igen senare');return}
    location.reload();return;
  }
  /* hämta den nya sidan FÖRST, töm cachen först när den är i hamn */
  fetch('./index.html',{cache:'reload'}).then(function(res){
    if(!res.ok)throw new Error('HTTP '+res.status);
    return caches.keys().then(function(ks){
      return Promise.all(ks.map(function(k){return caches.delete(k)}));
    }).then(function(){
      return navigator.serviceWorker?navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){return r.update()}));
      }):null;
    });
  }).then(function(){
    location.reload();
  }).catch(function(e){
    toast('Kunde inte hämta: '+(e.message||e)+' – appen är kvar som den är');
  });
}
function inFrame(){try{return window.self!==window.top}catch(e){return true}}
function copyBackup(){
  var t=document.getElementById('bkText');
  t.removeAttribute('readonly');
  t.focus();t.setSelectionRange(0,t.value.length);
  var ok=false;
  try{ok=document.execCommand('copy')}catch(e){}
  t.setAttribute('readonly','readonly');
  if(!ok&&navigator.clipboard){
    navigator.clipboard.writeText(t.value).then(function(){S.lastBackup=Date.now();save();toast('Kopierad')},
      function(){toast('Markera texten och kopiera för hand')});
    return;
  }
  if(ok){S.lastBackup=Date.now();save()}
  toast(ok?'Kopierad – klistra in i Anteckningar':'Markera texten och kopiera för hand');
}
function restoreBackup(){
  var v=document.getElementById('rsText').value.trim();
  if(!v)return;
  try{
    var d=JSON.parse(v);
    if(!d.weeks&&!d.plan)throw 0;
    load2(d);S=d;S.forcePush=true;save();rebuildDays();go('plan','shop');toast('Återställd');
  }catch(e){alert('Texten gick inte att läsa. Kontrollera att hela säkerhetskopian kom med.')}
}
function expData(){
  var b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='matveckan-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  S.lastBackup=Date.now();save();
}
function impData(inp){
  var f=inp.files[0];if(!f)return;var fr=new FileReader();
  fr.onload=function(){try{var d=JSON.parse(fr.result);if(!d.weeks&&!d.plan)throw 0;S=d;load2(d);S.forcePush=true;save();go('plan','shop');toast('Importerad')}
   catch(e){alert('Filen gick inte att läsa. Välj en fil som exporterats härifrån.')}};
  fr.readAsText(f);
}
function load2(d){
  if(!d.weeks&&d.std)d.weeks=d.std;
  if(!d.weeks)d.weeks=SEED_STD();
  if(!d.activeWeeks)d.activeWeeks=d.activeWeek?[d.activeWeek]:[1];
  if(!d.later)d.later={};if(!d.freshOf)d.freshOf={};if(!d.freshDays)d.freshDays={};if(!d.trash)d.trash=[];if(!d.tmpMove)d.tmpMove={};if(!d.snooze)d.snooze={};if(!d.temp)d.temp={};if(!d.qty)d.qty={};if(!d.alias)d.alias={};if(!d.cooked)d.cooked={};if(!d.units)d.units=[];if(!d.unitOf)d.unitOf={};
  if(!d.editWeek)d.editWeek=d.activeWeeks[0]||1;
  if(!d.extra)d.extra=[];if(!d.checked)d.checked={};if(!d.approved)d.approved={};
  if(!d.shopOf)d.shopOf=seedShops();
  if(!d.ordFram)d.ordFram=SEED_FRAM.map(normName);
  if(!d.ordWillys)d.ordWillys=SEED_GRUND.map(normName);
  if(!d.grund)d.grund=SEED_GRUND.map(function(n){return{id:uid(),name:n}});
  if(!d.framList)d.framList=SEED_FRAM.map(function(n){return{id:uid(),name:n}});
  if(!d.otherList)d.otherList=SEED_OTHER.map(function(o){return{id:uid(),name:o.n,store:o.b}});
  if(!d.storeName)d.storeName=seedStoreNames();
}
function wipe(){if(!confirm('Rensa allt och börja om från Påminnelse-listan?'))return;
  store.del(KEY);S=fresh();save();go('plan','shop');toast('Allt rensat')}

/* ---------------- ui ---------------- */
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(window._tt);window._tt=setTimeout(function(){t.classList.remove('on')},1600)}
function sheetOpen(h){document.getElementById('sheet').innerHTML='<button class="sheetx" onclick="sheetClose()" aria-label="Stäng">&times;</button><div class="grab"></div>'+h;
  document.getElementById('sheet').classList.add('on');document.getElementById('scrim').classList.add('on')}
function sheetClose(){
  var sh=document.getElementById('sheet');
  sh.style.transform='';sh.classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
}
(function(){
  var sh=document.getElementById('sheet'),y0=null,dy=0;
  sh.addEventListener('touchstart',function(e){
    if(sh.scrollTop>0){y0=null;return}
    y0=e.touches[0].clientY;dy=0;
  },{passive:true});
  sh.addEventListener('touchmove',function(e){
    if(y0===null)return;
    dy=e.touches[0].clientY-y0;
    if(dy>0)sh.style.transform='translateY('+dy+'px)';
  },{passive:true});
  sh.addEventListener('touchend',function(){
    if(y0===null)return;
    if(dy>90)sheetClose();
    else sh.style.transform='';
    y0=null;
  });
})();
document.getElementById('scrim').onclick=sheetClose;
function measureHeader(){
  var hd=document.querySelector('header');
  if(!hd||!hd.offsetHeight)return;
  window._hh=hd.offsetHeight;
  var st=document.documentElement.style;
  if(st&&st.setProperty)st.setProperty('--hh',hd.offsetHeight+'px');
}
measureHeader();window.addEventListener('resize',measureHeader);
(function(){
  var rail=document.getElementById('rail'),last=null;
  function pick(x,y){
    var el=document.elementFromPoint(x,y);
    if(!el||!el.getAttribute)return;
    var L=el.getAttribute('data-l');
    if(!L||L===last)return;
    last=L;
    Array.prototype.forEach.call(rail.children,function(b){b.classList.toggle('hit',b.getAttribute('data-l')===L)});
    jumpLetter(L);
  }
  rail.addEventListener('touchstart',function(e){
    e.preventDefault();last=null;rail.classList.add('drag');
    pick(e.touches[0].clientX,e.touches[0].clientY);
  },{passive:false});
  rail.addEventListener('touchmove',function(e){
    e.preventDefault();
    pick(e.touches[0].clientX,e.touches[0].clientY);
  },{passive:false});
  function end(){
    rail.classList.remove('drag');last=null;
    Array.prototype.forEach.call(rail.children,function(b){b.classList.remove('hit')});
    setTimeout(syncRail,150);
  }
  rail.addEventListener('touchend',end);
  rail.addEventListener('touchcancel',end);
  rail.addEventListener('click',function(e){
    var L=e.target&&e.target.getAttribute&&e.target.getAttribute('data-l');
    if(L)jumpLetter(L);
  });
})();
window.addEventListener('scroll',function(){
  if(current!=='plan'||sub!=='shop')return;
  clearTimeout(window._rt);window._rt=setTimeout(syncRail,180);
},{passive:true});
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){go(b.dataset.v)}});
load();
applyNewOrder();
migratePool();
migrateLunchbox();
rebuildDays();
gotoToday();go('plan','shop');

if('serviceWorker' in navigator&&location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
